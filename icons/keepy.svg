<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffef8"/>
      <stop offset="1" stop-color="#f4f0e2"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#fbbc04"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset="0.55" stop-color="#fdd835"/>
      <stop offset="1" stop-color="#f9a825"/>
    </radialGradient>
    <clipPath id="tile"><rect x="6" y="6" width="116" height="116" rx="27"/></clipPath>
  </defs>

  <!-- Apple Notes style tile: yellow header band over ruled paper -->
  <g clip-path="url(#tile)">
    <rect x="6" y="6" width="116" height="116" fill="url(#paper)"/>
    <rect x="6" y="6" width="116" height="27" fill="url(#band)"/>
    <rect x="6" y="32" width="116" height="1.5" fill="#e6a700" opacity="0.5"/>
    <g stroke="#d8d2bd" stroke-width="2" stroke-linecap="round">
      <line x1="20" y1="52" x2="108" y2="52"/>
      <line x1="20" y1="68" x2="108" y2="68"/>
      <line x1="20" y1="84" x2="108" y2="84"/>
      <line x1="20" y1="100" x2="108" y2="100"/>
    </g>
  </g>
  <rect x="6.5" y="6.5" width="115" height="115" rx="26.5" fill="none" stroke="#000" stroke-opacity="0.12"/>

  <!-- Google Keep bulb, sitting on the paper -->
  <g>
    <circle cx="64" cy="66" r="25" fill="#000" opacity="0.08" transform="translate(0 3)"/>
    <circle cx="64" cy="64" r="25" fill="url(#glass)"/>
    <circle cx="64" cy="64" r="9" fill="#fff" opacity="0.96"/>
    <path d="M52 84 h24 v6 a4 4 0 0 1 -4 4 h-16 a4 4 0 0 1 -4 -4 z" fill="#f98a00"/>
    <rect x="56" y="95" width="16" height="7" rx="3.5" fill="#f57c00"/>
  </g>
</svg>
